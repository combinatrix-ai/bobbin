<svg xmlns="http://www.w3.org/2000/svg" width="392" height="610" viewBox="0 0 392 610" role="img" aria-labelledby="title description">
  <title id="title">Bobbin animated menu bar demo</title>
  <desc id="description">Bobbin connects to Codex with a device code, then creates a thread, uses tools, answers, and saves it from the Mac menu bar.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#2c3027" flood-opacity="0.14"/>
    </filter>
    <path id="star" d="M0-6.8 2-2.2 7-2.1 3.1 1 4.4 6 0 3.1-4.4 6-3.1 1-7-2.1-2-2.2Z"/>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .auth-view { animation: auth-view 16s ease-in-out infinite; }
      .auth-waiting { animation: auth-waiting 16s ease-in-out infinite; }
      .auth-connected { animation: auth-connected 16s ease-out infinite; }
      .placeholder { animation: placeholder 16s linear infinite; }
      .typed-title { animation: typing 16s steps(24, end) infinite; }
      .send-button { transform-box: fill-box; transform-origin: center; animation: send-button 16s ease-in-out infinite; }
      .new-thread { transform-box: fill-box; transform-origin: center top; animation: new-thread 16s ease-out infinite; }
      .old-content { animation: old-content 16s ease-in-out infinite; }
      .list-view { animation: list-view 16s ease-in-out infinite; }
      .conversation-view { animation: conversation-view 16s ease-in-out infinite; }
      .tool-one { animation: tool-one 16s ease-out infinite; }
      .tool-two { animation: tool-two 16s ease-out infinite; }
      .tool-three { animation: tool-three 16s ease-out infinite; }
      .answer { animation: answer 16s ease-out infinite; }
      .save-star { animation: save-star 16s ease-in-out infinite; }
      .save-ripple { transform-box: fill-box; transform-origin: center; animation: save-ripple 16s ease-out infinite; }
      .saved-result { animation: saved-result 16s ease-out infinite; }
      .spinner { transform-box: fill-box; transform-origin: center; animation: spinner 1.1s linear infinite, spinner-life 16s linear infinite; }

      @keyframes auth-view {
        0%, 17% { opacity: 1; }
        21%, 100% { opacity: 0; }
      }
      @keyframes auth-waiting {
        0%, 11% { opacity: 1; }
        14%, 100% { opacity: 0; }
      }
      @keyframes auth-connected {
        0%, 11%, 21%, 100% { opacity: 0; transform: translateY(4px); }
        14%, 18% { opacity: 1; transform: translateY(0); }
      }

      @keyframes placeholder {
        0%, 22%, 100% { opacity: 1; }
        24%, 84% { opacity: 0; }
        87% { opacity: 1; }
      }
      @keyframes typing {
        0%, 23% { opacity: 0; clip-path: inset(0 100% 0 0); }
        24% { opacity: 1; clip-path: inset(0 100% 0 0); }
        31%, 35% { opacity: 1; clip-path: inset(0 0 0 0); }
        38%, 100% { opacity: 0; clip-path: inset(0 0 0 0); }
      }
      @keyframes send-button {
        0%, 23%, 39%, 100% { opacity: .3; transform: scale(1); }
        25%, 32%, 36% { opacity: 1; transform: scale(1); }
        34% { opacity: 1; transform: scale(.78); }
      }
      @keyframes new-thread {
        0%, 33% { opacity: 0; transform: translateY(-7px); }
        35%, 39% { opacity: 1; transform: translateY(0); }
        42%, 100% { opacity: 0; transform: translateY(0); }
      }
      @keyframes old-content {
        0%, 33% { transform: translateY(0); }
        35%, 40% { transform: translateY(32px); }
        43%, 100% { transform: translateY(0); }
      }
      @keyframes list-view {
        0%, 18% { opacity: 0; }
        21%, 39% { opacity: 1; }
        43%, 82% { opacity: 0; }
        87%, 100% { opacity: 1; }
      }
      @keyframes conversation-view {
        0%, 39% { opacity: 0; }
        43%, 81% { opacity: 1; }
        86%, 100% { opacity: 0; }
      }
      @keyframes tool-one {
        0%, 47% { opacity: 0; transform: translateY(4px); }
        50%, 86% { opacity: 1; transform: translateY(0); }
        91%, 100% { opacity: 0; }
      }
      @keyframes tool-two {
        0%, 54% { opacity: 0; transform: translateY(4px); }
        57%, 86% { opacity: 1; transform: translateY(0); }
        91%, 100% { opacity: 0; }
      }
      @keyframes tool-three {
        0%, 61% { opacity: 0; transform: translateY(4px); }
        64%, 86% { opacity: 1; transform: translateY(0); }
        91%, 100% { opacity: 0; }
      }
      @keyframes answer {
        0%, 68% { opacity: 0; transform: translateY(5px); }
        71%, 82% { opacity: 1; transform: translateY(0); }
        86%, 100% { opacity: 0; }
      }
      @keyframes save-star {
        0%, 76% { fill: transparent; stroke: #747872; }
        79%, 84% { fill: #b4ce55; stroke: #b4ce55; }
        88%, 100% { fill: transparent; stroke: #747872; }
      }
      @keyframes save-ripple {
        0%, 76% { opacity: 0; transform: scale(.35); }
        79% { opacity: .32; transform: scale(.6); }
        83%, 100% { opacity: 0; transform: scale(1.8); }
      }
      @keyframes saved-result {
        0%, 84% { opacity: 0; transform: translateY(-6px); }
        88%, 98% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(0); }
      }
      @keyframes spinner { to { transform: rotate(360deg); } }
      @keyframes spinner-life {
        0%, 47%, 70%, 100% { opacity: 0; }
        50%, 67% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .auth-view, .auth-waiting, .auth-connected,
        .placeholder, .typed-title, .send-button, .new-thread, .old-content,
        .list-view, .conversation-view, .tool-one, .tool-two, .tool-three,
        .answer, .save-star, .save-ripple, .saved-result, .spinner { animation-play-state: paused; }
      }
    </style>
  </defs>

  <rect width="392" height="610" fill="#f4f1e8"/>
  <rect width="392" height="30" fill="#f4f1e8"/>
  <path d="M0 29.5H392" stroke="#ddd9cf"/>
  <!-- Apple mark from Simple Icons v16 (CC0 1.0). -->
  <path transform="translate(9 4) scale(.72)" fill="#252820" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
  <rect x="354" y="3" width="34" height="24" rx="12" fill="#e5e2d9"/>
  <g transform="translate(362 7) scale(.03125)" fill="none" stroke="#252820" stroke-linecap="round" stroke-width="93.867">
    <path d="M449.843 177.682C481.271 255.469 463.156 344.509 403.832 403.832 344.509 463.156 255.469 481.271 177.682 449.843"/>
    <path d="M62.157 334.318C30.729 256.531 48.844 167.491 108.168 108.168 167.491 48.844 256.531 30.729 334.318 62.157"/>
    <rect x="179.2" y="179.2" width="153.6" height="153.6" rx="32.7" fill="#252820" stroke="none"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="0.5" y="31.5" width="391" height="560" rx="16" fill="#f5f5f2" stroke="#b9bbb5"/>
  </g>

  <g class="auth-view">
    <g transform="translate(164 76) scale(.125)" fill="none" stroke="#343832" stroke-linecap="round" stroke-width="70">
      <path d="M449.843 177.682C481.271 255.469 463.156 344.509 403.832 403.832 344.509 463.156 255.469 481.271 177.682 449.843"/>
      <path d="M62.157 334.318C30.729 256.531 48.844 167.491 108.168 108.168 167.491 48.844 256.531 30.729 334.318 62.157"/>
      <rect x="179.2" y="179.2" width="153.6" height="153.6" rx="32.7" fill="#343832" stroke="none"/>
    </g>
    <text class="ui" x="196" y="179" fill="#292d27" font-size="21" font-weight="700" text-anchor="middle">Connect to Codex</text>
    <text class="ui" x="196" y="205" fill="#7a7e77" font-size="12.5" text-anchor="middle">Enter this one-time code in your browser.</text>
    <rect x="96" y="224" width="200" height="54" rx="12" fill="#ffffff" stroke="#d2d3ce"/>
    <text class="mono" x="188" y="257" fill="#30342e" font-size="19" font-weight="700" letter-spacing="2.2" text-anchor="middle">ABCD-EFGH</text>
    <g transform="translate(267 243)" fill="none" stroke="#777b74" stroke-width="1.35">
      <rect x="0" y="3" width="10" height="10" rx="1.5"/>
      <path d="M3 3V0h10v10h-3"/>
    </g>
    <rect x="123" y="296" width="146" height="39" rx="19.5" fill="#9ebc34"/>
    <text class="ui" x="196" y="321" fill="#ffffff" font-size="12.5" font-weight="700" text-anchor="middle">Open in browser</text>
    <g transform="translate(-10 0)">
      <g class="auth-waiting">
        <circle cx="151" cy="365" r="3.5" fill="#a5a8a1"/>
        <text class="ui" x="162" y="369" fill="#858981" font-size="11.5">Waiting for approval</text>
      </g>
    </g>
    <g transform="translate(-10 0)">
      <g class="auth-connected" opacity="0">
        <circle cx="151" cy="365" r="9" fill="#9ebc34"/>
        <path d="m147 365 3 3 5-6" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
        <text class="ui" x="168" y="369" fill="#4f544b" font-size="11.5" font-weight="650">Connected to Codex</text>
      </g>
    </g>
  </g>

  <g class="list-view" opacity="0">
    <rect x="10" y="40" width="372" height="50" rx="13" fill="#ffffff" stroke="#dfdfda"/>
    <text class="ui placeholder" x="21" y="58" fill="#8b8e88" font-size="12.5">New thread…</text>
    <text class="ui typed-title" x="21" y="58" fill="#343832" font-size="12.5" opacity="0">Tighten the launch story</text>
    <g transform="translate(20 67)" fill="none" stroke="#777b74" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.1">
      <path d="M0 2.5h4l1.7 1.8H13v7.2H0z"/>
      <path d="M0 4.7h13"/>
    </g>
    <text class="ui" x="39" y="78" fill="#7f837c" font-size="11">Documents</text>
    <g class="send-button">
      <circle cx="362" cy="70" r="15" fill="#343832"/>
      <path d="M362 75.5v-11m0 0-4 4m4-4 4 4" fill="none" stroke="#f5f5f2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/>
    </g>

    <text class="ui" x="13" y="110" fill="#696d67" font-size="10" font-weight="700" letter-spacing=".7">THREADS</text>
    <g transform="translate(368 105)" fill="none" stroke="#686c66" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3">
      <circle r="4.3"/>
      <path d="M0-7v2M0 5v2M-7 0h2M5 0h2M-5-5l1.5 1.5M3.5 3.5 5 5M5-5 3.5-3.5M-3.5 3.5-5 5"/>
    </g>

    <g class="new-thread" opacity="0">
      <circle cx="19" cy="136" r="3" fill="#8caf27"/>
      <text class="ui" x="30" y="141" fill="#343832" font-size="13" font-weight="600">Tighten the launch story</text>
      <text class="ui" x="354" y="141" fill="#a4a6a1" font-size="11" text-anchor="end">Opening</text>
      <use href="#star" transform="translate(371 137)" fill="none" stroke="#767a74" stroke-width="1.25" stroke-linejoin="round"/>
    </g>

    <g class="old-content">
      <text class="ui" x="16" y="141" fill="#3f433d" font-size="13">Map the quiet edges</text>
      <text class="ui" x="354" y="141" fill="#aeb0ab" font-size="11" text-anchor="end">3h ago</text>
      <use href="#star" transform="translate(371 137)" fill="none" stroke="#7f837d" stroke-width="1.25" stroke-linejoin="round"/>
      <g opacity=".72">
        <text class="ui" x="16" y="173" fill="#4e524c" font-size="13">Triage the onboarding flow</text>
        <text class="ui" x="354" y="173" fill="#a9aca6" font-size="11" text-anchor="end">2d ago</text>
        <use href="#star" transform="translate(371 169)" fill="none" stroke="#858983" stroke-width="1.25" stroke-linejoin="round"/>
      </g>
      <g opacity=".48">
        <text class="ui" x="16" y="205" fill="#555952" font-size="13">A note for later</text>
        <text class="ui" x="354" y="205" fill="#9da09a" font-size="11" text-anchor="end">2d left</text>
        <use href="#star" transform="translate(371 201)" fill="none" stroke="#7f837d" stroke-width="1.25" stroke-linejoin="round"/>
      </g>
      <path d="M10 225.5H382" stroke="#d2d3ce"/>
      <text class="ui" x="16" y="245" fill="#a2a49f" font-size="10" font-weight="700" letter-spacing=".7">SAVED</text>
      <text class="ui" x="16" y="273" fill="#343832" font-size="13" font-weight="600">Keep: the small details</text>
      <use href="#star" transform="translate(371 269)" fill="#b4ce55"/>
      <g class="saved-result" opacity="0">
        <text class="ui" x="16" y="305" fill="#343832" font-size="13" font-weight="600">Tighten the launch story</text>
        <use href="#star" transform="translate(371 301)" fill="#b4ce55"/>
      </g>
    </g>
  </g>

  <g class="conversation-view" opacity="0">
    <path d="m22 47-6 7 6 7" fill="none" stroke="#4d514b" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    <text class="ui" x="40" y="59" fill="#343832" font-size="13.5" font-weight="700">Tighten the launch story</text>
    <circle class="save-ripple" cx="371" cy="53" r="8" fill="#b4ce55" opacity="0"/>
    <use class="save-star" href="#star" transform="translate(371 53)" fill="none" stroke="#747872" stroke-width="1.35" stroke-linejoin="round"/>
    <g transform="translate(14 78)" fill="none" stroke="#737770" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.15">
      <path d="M0 2.5h4l1.7 1.8H13v7.2H0z"/>
      <path d="M0 4.7h13"/>
    </g>
    <text class="ui" x="35" y="89" fill="#646862" font-size="11.5">Documents</text>
    <text class="mono" x="378" y="89" fill="#a0a39d" font-size="9.8" text-anchor="end">Auto review · luna · xhigh</text>
    <path d="M1 94.5H391" stroke="#d2d3ce"/>

    <rect x="87" y="106" width="291" height="47" rx="14" fill="#ffffff"/>
    <text class="ui" x="96" y="126" fill="#242822" font-size="13">
      <tspan x="96">Can you tighten the launch story and show me</tspan>
      <tspan x="96" dy="15">what changed?</tspan>
    </text>

    <g class="tool-one" opacity="0">
      <g transform="translate(15 181)" fill="none" stroke="#747872" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.1">
        <rect width="10" height="8" rx="1"/>
        <path d="m3 3 2 1.5L3 6M6 6h2"/>
      </g>
      <text class="mono" x="32" y="189" fill="#666a64" font-size="10.8">swift test --filter LaunchNarrativeTests</text>
      <text class="mono" x="378" y="189" fill="#6f736d" font-size="10.2" text-anchor="end">1.8s</text>
      <g transform="translate(370 173)">
        <path class="spinner" d="M0-5a5 5 0 0 1 5 5" fill="none" stroke="#8caf27" stroke-linecap="round" stroke-width="1.5" opacity="0"/>
      </g>
    </g>

    <g class="tool-two" opacity="0">
      <path d="m16 207 6-6 2 2-6 6-3 1z" fill="none" stroke="#858983" stroke-linejoin="round" stroke-width="1.1"/>
      <text class="ui" x="32" y="210" fill="#696d67" font-size="11.5">3 files changed</text>
      <text class="mono" x="378" y="210" fill="#8caf27" font-size="10.2" text-anchor="end">done</text>
    </g>

    <g class="tool-three" opacity="0">
      <g transform="translate(15 224)" fill="none" stroke="#777b74" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.1">
        <path d="m0 8 8-8 3 3-8 8H0z"/>
        <path d="m6 2 3 3M8 0l2-2 5 5-2 2"/>
      </g>
      <text class="ui" x="32" y="232" fill="#555952" font-size="11.5">notebook / summarize</text>
      <text class="mono" x="378" y="232" fill="#6f736d" font-size="10.2" text-anchor="end">0.9s</text>
    </g>

    <text class="ui answer" x="14" y="276" fill="#242822" font-size="13" opacity="0">
      <tspan x="14">The story now opens with the user outcome, then makes the</tspan>
      <tspan x="14" dy="15">quiet automation visible. I kept the useful details and let the</tspan>
      <tspan x="14" dy="15">rest get out of the way.</tspan>
    </text>

    <path d="M1 520.5H391" stroke="#d2d3ce"/>
    <rect x="10" y="531" width="334" height="42" rx="14" fill="#ffffff" stroke="#dfdfda"/>
    <text class="ui" x="21" y="557" fill="#8b8e88" font-size="12.5">Message</text>
    <circle cx="367" cy="552" r="15" fill="#343832"/>
    <path d="M367 557.5v-11m0 0-4 4m4-4 4 4" fill="none" stroke="#f5f5f2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/>
  </g>
</svg>
