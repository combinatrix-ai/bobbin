<svg xmlns="http://www.w3.org/2000/svg" width="392" height="610" viewBox="0 0 392 610" role="img" aria-labelledby="title description">
  <title id="title">Bobbin menu bar thread list</title>
  <desc id="description">A compact macOS menu bar popover with recent threads fading over time and a saved thread that stays.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#2c3027" flood-opacity="0.14"/>
    </filter>
    <path id="star" d="M0-6.8 2-2.2 7-2.1 3.1 1 4.4 6 0 3.1-4.4 6-3.1 1-7-2.1-2-2.2Z"/>
  </defs>

  <rect width="392" height="610" fill="#f4f1e8"/>

  <!-- A deliberately quiet slice of the macOS menu bar. -->
  <rect width="392" height="30" fill="#f4f1e8"/>
  <path d="M0 29.5H392" stroke="#ddd9cf"/>
  <!-- Apple mark from Simple Icons v16 (CC0 1.0). -->
  <path transform="translate(9 4) scale(.72)" fill="#252820" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
  <rect x="354" y="3" width="34" height="24" rx="12" fill="#e5e2d9"/>
  <g transform="translate(362 7) scale(.03125)" fill="none" stroke="#252820" stroke-linecap="round" stroke-width="93.867">
    <path d="M449.843 177.682C481.271 255.469 463.156 344.509 403.832 403.832 344.509 463.156 255.469 481.271 177.682 449.843"/>
    <path d="M62.157 334.318C30.729 256.531 48.844 167.491 108.168 108.168 167.491 48.844 256.531 30.729 334.318 62.157"/>
    <rect x="179.2" y="179.2" width="153.6" height="153.6" rx="32.7" fill="#252820" stroke="none"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="0.5" y="31.5" width="391" height="560" rx="16" fill="#f5f5f2" stroke="#b9bbb5"/>
  </g>

  <rect x="10" y="40" width="372" height="50" rx="13" fill="#ffffff" stroke="#dfdfda"/>
  <text x="21" y="58" fill="#8b8e88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5">New thread…</text>
  <g transform="translate(20 67)" fill="none" stroke="#777b74" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.1">
    <path d="M0 2.5h4l1.7 1.8H13v7.2H0z"/>
    <path d="M0 4.7h13"/>
  </g>
  <text x="39" y="78" fill="#7f837c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Documents</text>
  <g opacity=".3">
    <circle cx="362" cy="70" r="15" fill="#343832"/>
    <path d="M362 75.5v-11m0 0-4 4m4-4 4 4" fill="none" stroke="#f5f5f2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/>
  </g>

  <text x="13" y="110" fill="#696d67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing=".7">THREADS</text>
  <g transform="translate(368 105)" fill="none" stroke="#686c66" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3">
    <circle r="4.3"/>
    <path d="M0-7v2M0 5v2M-7 0h2M5 0h2M-5-5l1.5 1.5M3.5 3.5 5 5M5-5 3.5-3.5M-3.5 3.5-5 5"/>
  </g>

  <circle cx="19" cy="136" r="3" fill="#8caf27"/>
  <text x="30" y="141" fill="#343832" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Tighten the launch story</text>
  <text x="354" y="141" fill="#a4a6a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="end">Running</text>
  <use href="#star" transform="translate(371 137)" fill="none" stroke="#767a74" stroke-width="1.25" stroke-linejoin="round"/>

  <text x="16" y="173" fill="#3f433d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Map the quiet edges</text>
  <text x="354" y="173" fill="#aeb0ab" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="end">3h ago</text>
  <use href="#star" transform="translate(371 169)" fill="none" stroke="#7f837d" stroke-width="1.25" stroke-linejoin="round"/>

  <g opacity=".72">
    <text x="16" y="205" fill="#4e524c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Triage the onboarding flow</text>
    <text x="354" y="205" fill="#a9aca6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="end">2d ago</text>
    <use href="#star" transform="translate(371 201)" fill="none" stroke="#858983" stroke-width="1.25" stroke-linejoin="round"/>
  </g>

  <g opacity=".48">
    <text x="16" y="237" fill="#555952" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">A note for later</text>
    <text x="354" y="237" fill="#9da09a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="end">2d left</text>
    <use href="#star" transform="translate(371 233)" fill="none" stroke="#7f837d" stroke-width="1.25" stroke-linejoin="round"/>
  </g>

  <path d="M10 257.5H382" stroke="#d2d3ce"/>
  <text x="16" y="277" fill="#a2a49f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing=".7">SAVED</text>
  <text x="16" y="305" fill="#343832" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Keep: the small details</text>
  <use href="#star" transform="translate(371 301)" fill="#b4ce55"/>
