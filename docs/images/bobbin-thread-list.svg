<svg xmlns="http://www.w3.org/2000/svg" width="392" height="560" viewBox="0 0 392 560" role="img" aria-labelledby="title description">
  <title id="title">Bobbin thread list</title>
  <desc id="description">Recent threads fade with age while a saved thread remains.</desc>
  <defs>
    <path id="star" d="M0-6.8 2-2.2 7-2.1 3.1 1 4.4 6 0 3.1-4.4 6-3.1 1-7-2.1-2-2.2Z"/>
  </defs>

  <rect width="392" height="560" rx="16" fill="#f5f5f2" stroke="#b9bbb5"/>
  <rect x="10" y="9" width="372" height="50" rx="13" fill="#ffffff" stroke="#dfdfda"/>
  <text x="21" y="27" fill="#8b8e88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5">New thread…</text>
  <g transform="translate(20 36)" fill="none" stroke="#777b74" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.1">
    <path d="M0 2.5h4l1.7 1.8H13v7.2H0z"/>
    <path d="M0 4.7h13"/>
  </g>
  <text x="39" y="47" fill="#7f837c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Documents</text>
  <g opacity=".3">
    <circle cx="362" cy="39" r="15" fill="#343832"/>
    <path d="M362 44.5v-11m0 0-4 4m4-4 4 4" fill="none" stroke="#f5f5f2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/>
  </g>

  <text x="13" y="79" fill="#696d67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing=".7">THREADS</text>
  <g transform="translate(368 74)" fill="none" stroke="#686c66" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3">
    <circle r="4.3"/>
    <path d="M0-7v2M0 5v2M-7 0h2M5 0h2M-5-5l1.5 1.5M3.5 3.5 5 5M5-5 3.5-3.5M-3.5 3.5-5 5"/>
  </g>

  <circle cx="19" cy="105" r="3" fill="#8caf27"/>
  <text x="30" y="110" fill="#343832" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Tighten the launch story</text>
  <text x="354" y="110" fill="#a4a6a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="end">Running</text>
  <use href="#star" transform="translate(371 106)" fill="none" stroke="#767a74" stroke-width="1.25" stroke-linejoin="round"/>

  <text x="16" y="142" fill="#3f433d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Map the quiet edges</text>
  <text x="354" y="142" fill="#aeb0ab" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="end">3h ago</text>
  <use href="#star" transform="translate(371 138)" fill="none" stroke="#7f837d" stroke-width="1.25" stroke-linejoin="round"/>

  <g opacity=".72">
    <text x="16" y="174" fill="#4e524c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Triage the onboarding flow</text>
    <text x="354" y="174" fill="#a9aca6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="end">2d ago</text>
    <use href="#star" transform="translate(371 170)" fill="none" stroke="#858983" stroke-width="1.25" stroke-linejoin="round"/>
  </g>

  <g opacity=".48">
    <text x="16" y="206" fill="#555952" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">A note for later</text>
    <text x="354" y="206" fill="#9da09a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="end">2d left</text>
    <use href="#star" transform="translate(371 202)" fill="none" stroke="#7f837d" stroke-width="1.25" stroke-linejoin="round"/>
  </g>

  <path d="M10 226.5H382" stroke="#d2d3ce"/>
  <text x="16" y="246" fill="#a2a49f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing=".7">SAVED</text>
  <text x="16" y="274" fill="#343832" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Keep: the small details</text>
  <use href="#star" transform="translate(371 270)" fill="#b4ce55"/>
