<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-labelledby="title description">
  <title id="title">Bobbin controls animation</title>
  <desc id="description">Bobbin changes a thread's Codex model, reasoning effort, and trust, then edits an autosaved system prompt for new threads.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#34372f" flood-opacity="0.12"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .focus-model, .focus-reasoning, .focus-trust, .focus-prompt,
      .model-old, .model-new, .reasoning-old, .reasoning-new,
      .trust-old, .trust-new, .prompt-closed, .prompt-open,
      .prompt-text { animation-duration: 16s; animation-iteration-count: infinite; }
      .focus-model { animation-name: focus-model; }
      .focus-reasoning { animation-name: focus-reasoning; }
      .focus-trust { animation-name: focus-trust; }
      .focus-prompt { animation-name: focus-prompt; }
      .model-old { animation-name: old-model; }
      .model-new { animation-name: new-model; }
      .reasoning-old { animation-name: old-reasoning; }
      .reasoning-new { animation-name: new-reasoning; }
      .trust-old { animation-name: old-trust; }
      .trust-new { animation-name: new-trust; }
      .prompt-closed { animation-name: prompt-closed; }
      .prompt-open { animation-name: prompt-open; }
      .prompt-text { animation-name: prompt-text; animation-timing-function: steps(32, end); }

      @keyframes focus-model { 0%, 21% { opacity: 1; } 25%, 100% { opacity: 0; } }
      @keyframes focus-reasoning { 0%, 21%, 48%, 100% { opacity: 0; } 25%, 44% { opacity: 1; } }
      @keyframes focus-trust { 0%, 48%, 71%, 100% { opacity: 0; } 52%, 67% { opacity: 1; } }
      @keyframes focus-prompt { 0%, 71%, 100% { opacity: 0; } 75%, 96% { opacity: 1; } }
      @keyframes old-model { 0%, 9% { opacity: 1; } 13%, 100% { opacity: 0; } }
      @keyframes new-model { 0%, 9% { opacity: 0; } 13%, 100% { opacity: 1; } }
      @keyframes old-reasoning { 0%, 32% { opacity: 1; } 36%, 100% { opacity: 0; } }
      @keyframes new-reasoning { 0%, 32% { opacity: 0; } 36%, 100% { opacity: 1; } }
      @keyframes old-trust { 0%, 56% { opacity: 1; } 60%, 100% { opacity: 0; } }
      @keyframes new-trust { 0%, 56% { opacity: 0; } 60%, 100% { opacity: 1; } }
      @keyframes prompt-closed { 0%, 73%, 100% { opacity: 1; } 77%, 96% { opacity: 0; } }
      @keyframes prompt-open { 0%, 73%, 100% { opacity: 0; } 77%, 96% { opacity: 1; } }
      @keyframes prompt-text {
        0%, 79% { opacity: 0; clip-path: inset(0 100% 0 0); }
        81% { opacity: 1; clip-path: inset(0 100% 0 0); }
        90%, 96% { opacity: 1; clip-path: inset(0 0 0 0); }
        100% { opacity: 0; clip-path: inset(0 0 0 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .focus-model, .focus-reasoning, .focus-trust, .focus-prompt,
        .model-old, .model-new, .reasoning-old, .reasoning-new,
        .trust-old, .trust-new, .prompt-closed, .prompt-open,
        .prompt-text { animation-play-state: paused; }
      }
    </style>
  </defs>

  <rect width="560" height="360" rx="18" fill="#eeece3"/>
  <g filter="url(#shadow)">
    <rect x="42" y="15" width="476" height="330" rx="16" fill="#f7f7f4" stroke="#bec0ba"/>
  </g>

  <g transform="translate(0 -60)">
  <g>
    <rect class="focus-model" x="58" y="98" width="444" height="56" rx="12" fill="#e7efc9"/>
    <text class="ui" x="76" y="132" fill="#3a3e38" font-size="13" font-weight="650">Model</text>
    <text class="mono model-old" x="476" y="132" fill="#6d716a" font-size="12" text-anchor="end">gpt-5.6-luna</text>
    <text class="mono model-new" x="476" y="132" fill="#363a34" font-size="12" font-weight="700" text-anchor="end" opacity="0">gpt-5.6-sol</text>
    <path d="m487 123 4 4 4-4" fill="none" stroke="#73776f" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4"/>
  </g>

  <g>
    <rect class="focus-reasoning" x="58" y="158" width="444" height="56" rx="12" fill="#e7efc9" opacity="0"/>
    <text class="ui" x="76" y="192" fill="#3a3e38" font-size="13" font-weight="650">Reasoning</text>
    <text class="mono reasoning-old" x="476" y="192" fill="#6d716a" font-size="12" text-anchor="end">high</text>
    <text class="mono reasoning-new" x="476" y="192" fill="#363a34" font-size="12" font-weight="700" text-anchor="end" opacity="0">xhigh</text>
    <path d="m487 183 4 4 4-4" fill="none" stroke="#73776f" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4"/>
  </g>

  <g>
    <rect class="focus-trust" x="58" y="218" width="444" height="56" rx="12" fill="#e7efc9" opacity="0"/>
    <text class="ui" x="76" y="252" fill="#3a3e38" font-size="13" font-weight="650">Trust</text>
    <text class="ui trust-old" x="476" y="252" fill="#6d716a" font-size="12" text-anchor="end">Auto review</text>
    <text class="ui trust-new" x="476" y="252" fill="#363a34" font-size="12" font-weight="700" text-anchor="end" opacity="0">Allow all</text>
    <path d="m487 243 4 4 4-4" fill="none" stroke="#73776f" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4"/>
  </g>

  <g class="prompt-closed">
    <rect class="focus-prompt" x="58" y="278" width="444" height="56" rx="12" fill="#e7efc9" opacity="0"/>
    <text class="ui" x="76" y="312" fill="#3a3e38" font-size="13" font-weight="650">System prompt</text>
    <text class="ui" x="476" y="312" fill="#6d716a" font-size="12" text-anchor="end">Edit for new threads</text>
    <path d="m487 303 4 4 4-4" fill="none" stroke="#73776f" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4"/>
  </g>

  <g class="prompt-open" opacity="0">
    <rect x="58" y="278" width="444" height="93" rx="12" fill="#e7efc9"/>
    <text class="ui" x="76" y="302" fill="#3a3e38" font-size="13" font-weight="700">System prompt</text>
    <text class="ui" x="76" y="321" fill="#7a7e76" font-size="10.5">Applied to new threads</text>
    <rect x="76" y="334" width="408" height="29" rx="8" fill="#ffffff" stroke="#cfd1ca"/>
    <text class="mono prompt-text" x="87" y="353" fill="#343832" font-size="10.5" opacity="0">Be concise. Verify changes before answering.</text>
  </g>
  </g>
</svg>
