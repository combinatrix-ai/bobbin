name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, and publish
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CODESIGN_IDENTITY: "Developer ID Application: COMBINATRIX K.K. (3Y275A5TZ8)"
      NOTARY_PROFILE: bobbin-notary

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release metadata
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          }

          ACTUAL_TAG="$(git describe --tags --exact-match HEAD)"
          [[ "$ACTUAL_TAG" == "$RELEASE_TAG" ]] || {
            echo "Checked out $ACTUAL_TAG, expected $RELEASE_TAG" >&2
            exit 1
          }

          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          [[ "v$BUNDLE_VERSION" == "$RELEASE_TAG" ]] || {
            echo "Tag $RELEASE_TAG does not match bundle version $BUNDLE_VERSION" >&2
            exit 1
          }

          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)"
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "Invalid bundle build number: $BUILD_NUMBER" >&2
            exit 1
          }

      - name: Run tests
        run: swift test

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          : "${BUILD_CERTIFICATE_BASE64:?Missing BUILD_CERTIFICATE_BASE64 secret}"
          : "${P12_PASSWORD:?Missing P12_PASSWORD secret}"

          CERTIFICATE_PATH="$RUNNER_TEMP/bobbin-release.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/bobbin-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$CODESIGN_IDENTITY"
          rm -f "$CERTIFICATE_PATH"

      - name: Store Apple notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?Missing APPLE_ID secret}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID secret}"
          : "${NOTARY_PASSWORD:?Missing NOTARY_PASSWORD secret}"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARY_PASSWORD"

      - name: Build, sign, and notarize
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SPARKLE_ED_PRIVATE_KEY:?Missing SPARKLE_ED_PRIVATE_KEY secret}"

          KEY_FILE="$RUNNER_TEMP/bobbin-sparkle-ed-private-key"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"

          ED_KEY_FILE="$KEY_FILE" \
          TAG="$RELEASE_TAG" \
          scripts/release.sh

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          RELEASE_DIR="dist/$RELEASE_TAG"
          cd "$RELEASE_DIR"

          shasum -a 256 -c "Bobbin-$RELEASE_TAG-checksums.txt"
          ARCHITECTURES="$(lipo -archs Bobbin.app/Contents/MacOS/Bobbin)"
          [[ "$ARCHITECTURES" == *arm64* && "$ARCHITECTURES" == *x86_64* ]]
          codesign --verify --deep --strict Bobbin.app
          xcrun stapler validate Bobbin.app
          xcrun stapler validate "Bobbin-$RELEASE_TAG.dmg"
          spctl --assess --type execute --verbose=2 Bobbin.app
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=2 \
            "Bobbin-$RELEASE_TAG.dmg"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_DIR="dist/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            "$RELEASE_DIR/Bobbin-$RELEASE_TAG.dmg" \
            "$RELEASE_DIR/Bobbin-$RELEASE_TAG.zip" \
            "$RELEASE_DIR/appcast.xml" \
            "$RELEASE_DIR/Bobbin-$RELEASE_TAG-checksums.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bobbin ${RELEASE_TAG#v}" \
            --generate-notes \
            --latest \
            --verify-tag

      - name: Clean up release keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/bobbin-release.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
